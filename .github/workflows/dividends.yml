name: 股息数据更新

on:
  schedule:
    - cron: "37 10 * * 1-5"   # 周一至五 MYT 18:37（马股 17:00 收盘后）
  workflow_dispatch:
  push:
    branches: [main, dividend]
    paths:
      - dividend-tickers.json
      - dividend-overrides.json
      - scripts/update_dividends.py
      - .github/workflows/dividends.yml

permissions:
  contents: write

concurrency:
  group: dividends-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 抓取价格与股息
        run: python3 scripts/update_dividends.py
      - name: 提交 dividends.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dividends.json
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git commit -m "data: 股息数据更新 $(TZ=Asia/Kuala_Lumpur date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
